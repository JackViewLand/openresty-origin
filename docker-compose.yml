services:
  openresty1:
    # image: openresty/openresty:1.25.3.1-1-jammy
    build:
      context: ./build
      dockerfile: ./Dockerfile
    image: openresty:1.27.1.2-13
    container_name: 'openresty1'
    restart: 'always'
    ports:
      - '80:80'
      - '443:443'
      - '5066:5066'
    environment:
      SERVER: "openresty1"
    # openresty1 啟動時要解析 upstream 的 openresty2（upstream.conf）與 goapi（default.conf 的 proxy_pass），
    # 解析不到會直接 emerg 退出。所以是 openresty1 依賴這兩個，不是反過來。
    # 只需要容器存在（DNS 有名字），不必等 goapi 的 air 編譯完。
    depends_on:
      - openresty2
      - goapi
    volumes:
      - './openresty1/log:/var/log/nginx'
      - './openresty1/conf.d:/etc/nginx/conf.d'
      - './nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf'
      - './data:/data'
      - './openresty1/cert:/usr/local/openresty/nginx/cert'
      - './certbot/www:/var/www/certbot'
      - './certbot/conf:/etc/letsencrypt'
    networks:
      - lab
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  openresty2:
    image: openresty:1.27.1.2-13
    container_name: 'openresty2'
    restart: 'always'
    ports:
      - '8080:8080'
    environment:
      SERVER: "openresty2"
    volumes:
      - './openresty2/log:/var/log/nginx'
      - './openresty2/conf.d:/etc/nginx/conf.d'
      - './nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf'
      - './data:/data'
      - './openresty2/cert:/usr/local/openresty/nginx/cert'
      - './certbot/conf:/etc/letsencrypt'
    networks:
      - lab
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  # 由 ./create_cert.sh 與 ./renew_cert.sh 以 `docker compose run --rm` 呼叫，
  # 不需常駐；profiles 讓 `docker compose up` 不會誤啟動它。
  certbot:
    image: certbot/certbot
    profiles:
      - certbot
    volumes:
      - './certbot/www:/var/www/certbot'
      - './certbot/conf:/etc/letsencrypt'

  goapi:
    build:
        context: ./goapi
    container_name: goapi
    working_dir: /app
    volumes:
      - ./goapi:/app
    ports:
      - "5000:5000"
    command: air
    networks:
      - lab

networks:
  lab:
